<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <h1>Welcome</h1>
            <p class="subtitle">Find all my links below</p>
        </div>

        <div class="links-container">
            <!-- Add your links here -->
            <a href="https://github.com/yourusername" class="link-button" target="_blank">
                <span class="icon">🐙</span>
                <span class="text">GitHub</span>
            </a>

            <a href="https://twitter.com/yourusername" class="link-button" target="_blank">
                <span class="icon">🐦</span>
                <span class="text">Twitter</span>
            </a>

            <a href="https://linkedin.com/in/yourusername" class="link-button" target="_blank">
                <span class="icon">💼</span>
                <span class="text">LinkedIn</span>
            </a>

            <a href="https://yourwebsite.com" class="link-button" target="_blank">
                <span class="icon">🌐</span>
                <span class="text">Website</span>
            </a>

            <a href="mailto:your@email.com" class="link-button">
                <span class="icon">📧</span>
                <span class="text">Email</span>
            </a>
        </div>

        <footer>
            <p>© 2026 - Built with ❤️</p>
        </footer>
    </div>
</body>
</html>
