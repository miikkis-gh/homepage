<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="profile-section">
            <h1>Welcome</h1>
            <p class="subtitle">Find all my links below</p>
        </div>

        <div class="links-container">
            <!-- Add your links here -->
            <a href="https://suno.com/@yourusername" class="link-button" target="_blank">
                <span class="icon">🎵</span>
                <span class="text">Suno</span>
            </a>

            <a href="https://soundcloud.com/yourusername" class="link-button" target="_blank">
                <span class="icon">🎧</span>
                <span class="text">Soundcloud</span>
            </a>

            <a href="https://open.spotify.com/artist/yourid" class="link-button" target="_blank">
                <span class="icon">🎶</span>
                <span class="text">Spotify</span>
            </a>

            <a href="https://discord.gg/yourinvite" class="link-button" target="_blank">
                <span class="icon">💬</span>
                <span class="text">Discord</span>
            </a>

            <a href="https://twitch.tv/yourusername" class="link-button" target="_blank">
                <span class="icon">📺</span>
                <span class="text">Twitch</span>
            </a>

            <a href="https://instagram.com/yourusername" class="link-button" target="_blank">
                <span class="icon">📸</span>
                <span class="text">Instagram</span>
            </a>

            <a href="https://youtube.com/@yourusername" class="link-button" target="_blank">
                <span class="icon">🎬</span>
                <span class="text">Youtube</span>
            </a>
        </div>

        <footer>
            <p>© 2026 - Built with ❤️</p>
        </footer>
    </div>
</body>
</html>
