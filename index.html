                    </svg>

        </div>

        <aside class="playlists-column" aria-label="Public Spotify playlists">
            <h2 class="column-heading">Playlists</h2>
            <div class="playlist-embeds">
                <iframe style="border-radius: 12px" src="https://open.spotify.com/embed/playlist/1HjNFpzIThXdkJYylLhSTI?utm_source=generator&theme=0" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="2026 kesä playlist"></iframe>
            </div>
        </aside>
        </div>

        <footer class="footer">
            <p>&copy; 2026 miikkis</p>
        </footer>
    </main>

    <script>
        // Add loaded class after a brief delay for smooth entrance
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        // Live Helsinki date/time clock under the title
        const clockEl = document.getElementById('clock');
        const clockFormatter = new Intl.DateTimeFormat('fi-FI', {
            timeZone: 'Europe/Helsinki',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
        });

        function updateClock() {
            clockEl.textContent = clockFormatter.format(new Date());
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Current location, sourced from the "Location" sheet tab (written by
        // an iPhone Shortcuts automation via Apps Script)
        const LOCATION_CSV_URL =
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1IWRGe0nevqnYGTyzMQYwSPA-8ynwUjSrGRZfMlGs6DGyC1ywITvZpSQG8dUSOVljbXUDBS2mZfNN/pub?gid=1935106307&single=true&output=csv';

        fetch(LOCATION_CSV_URL)
            .then((res) => {
                if (!res.ok) throw new Error(`Location fetch failed: ${res.status}`);
                return res.text();
            })
            .then((csvText) => {
                const rows = parseCsv(csvText);
                const place = (rows[0] && rows[0][0] || '').trim();
                if (place) {
                    document.getElementById('location-text').textContent = `📍 ${place}`;
                    document.getElementById('location').hidden = false;
                }
            })
            .catch((err) => console.error('Failed to load location:', err));

        // Info icon next to the location line: click/tap toggles a tooltip
        // explaining the marker (hover also works, via CSS, for desktop pointers)
        const locationInfo = document.getElementById('location-info');
        if (locationInfo) {
            locationInfo.addEventListener('click', (e) => {
                e.stopPropagation();
                locationInfo.classList.toggle('open');
            });
            document.addEventListener('click', () => locationInfo.classList.remove('open'));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') locationInfo.classList.remove('open');
            });
        }

        // Subtle mouse-parallax for the background spotlight
        const spotlight = document.querySelector('.spotlight');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (spotlight && !prefersReducedMotion) {
            const maxOffset = 40;
            window.addEventListener('mousemove', (e) => {
                const xRatio = e.clientX / window.innerWidth - 0.5;
                const yRatio = e.clientY / window.innerHeight - 0.5;
                spotlight.style.transform =
                    `translate(${xRatio * maxOffset * 2}px, ${yRatio * maxOffset * 2}px)`;
            });
        }

        // Updates feed, sourced from a published Google Sheet (CSV)
        const UPDATES_CSV_URL =
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vT1IWRGe0nevqnYGTyzMQYwSPA-8ynwUjSrGRZfMlGs6DGyC1ywITvZpSQG8dUSOVljbXUDBS2mZfNN/pub?gid=0&single=true&output=csv';
        const MAX_UPDATES = 8;

        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (inQuotes) {
                    if (char === '"' && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        field += char;
                    }
                } else if (char === '"') {
                    inQuotes = true;
                } else if (char === ',') {
                    row.push(field);
                    field = '';
                } else if (char === '\n' || char === '\r') {
                    if (char === '\r' && text[i + 1] === '\n') i++;
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else {
                    field += char;
                }
            }
            if (field.length || row.length) {
                row.push(field);
                rows.push(row);
            }
            return rows.filter((r) => r.some((cell) => cell.trim() !== ''));
        }

        function linkifyInto(container, text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let lastIndex = 0;
            let match;

            while ((match = urlRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
                }
                const link = document.createElement('a');
                link.href = match[0];
                link.textContent = match[0];
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.className = 'tweet-link';
                container.appendChild(link);
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < text.length) {
                container.appendChild(document.createTextNode(text.slice(lastIndex)));
            }
        }

        function renderUpdates(posts) {
            const feed = document.getElementById('tweet-feed');
            feed.innerHTML = '';

            if (!posts.length) {
                const empty = document.createElement('p');
                empty.className = 'tweet-empty';
                empty.textContent = 'No updates yet.';
                feed.appendChild(empty);
                return;
            }

            posts.slice(0, MAX_UPDATES).forEach((post) => {
                const card = document.createElement('article');
                card.className = 'tweet-card';

                const header = document.createElement('div');
                header.className = 'tweet-header';

                const name = document.createElement('span');
                name.className = 'tweet-name';
                name.textContent = 'miikkis';

                const date = document.createElement('span');
                date.className = 'tweet-date';
                date.textContent = post.date;

                header.append(name, date);

                const isQuote = post.text.startsWith('>');
                const text = document.createElement(isQuote ? 'blockquote' : 'p');
                text.className = isQuote ? 'tweet-quote' : 'tweet-text';
                linkifyInto(text, isQuote ? post.text.slice(1).trim() : post.text);

                card.append(header, text);

                if (post.image) {
                    const image = document.createElement('img');
                    image.className = 'tweet-image';
                    image.src = post.image;
                    image.alt = '';
                    image.loading = 'lazy';
                    card.appendChild(image);
                }

                feed.appendChild(card);
            });
        }

        // Accepts YYYY-MM-DD or D.M.YYYY / DD.MM.YYYY; returns a sortable timestamp (or -Infinity if unparseable)
        function parseDate(value) {
            const iso = value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]).getTime();

            const dotted = value.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
            if (dotted) return new Date(+dotted[3], +dotted[2] - 1, +dotted[1]).getTime();

            const fallback = Date.parse(value);
            return Number.isNaN(fallback) ? -Infinity : fallback;
        }

        fetch(UPDATES_CSV_URL)
            .then((res) => {
                if (!res.ok) throw new Error(`Sheet fetch failed: ${res.status}`);
                return res.text();
            })
            .then((csvText) => {
                const rows = parseCsv(csvText);
                if (!rows.length) return renderUpdates([]);

                const looksLikeHeader = rows[0][0] && rows[0][0].trim().toLowerCase() === 'date';
                const header = looksLikeHeader ? rows[0] : ['date', 'text', 'image'];
                const dataRows = looksLikeHeader ? rows.slice(1) : rows;

                const dateIndex = header.findIndex((h) => h.trim().toLowerCase() === 'date');
                const textIndex = header.findIndex((h) => h.trim().toLowerCase() === 'text');
                const imageIndex = header.findIndex((h) => h.trim().toLowerCase() === 'image');

                const posts = dataRows
                    .map((r) => ({
                        date: (r[dateIndex] || '').trim(),
                        text: (r[textIndex] || '').trim(),
                        image: (r[imageIndex] || '').trim(),
                    }))
                    .filter((p) => p.text)
                    .sort((a, b) => parseDate(b.date) - parseDate(a.date));

                renderUpdates(posts);
            })
            .catch((err) => {
                console.error('Failed to load updates feed:', err);
                const feed = document.getElementById('tweet-feed');
                feed.innerHTML = '';
                const errorMsg = document.createElement('p');
                errorMsg.className = 'tweet-empty';
                errorMsg.textContent = "Couldn't load updates.";
                feed.appendChild(errorMsg);
            });
    </script>
